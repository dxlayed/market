<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitzMarket | MM2 listings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12101f;--surface:#1d1a30;--raise:#26223e;--line:#37325a;--text:#f1eefc;--mute:#a29fc0;--gold:#ffb938;--violet:#8b6cff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3,.logo{font-family:Outfit,system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button{cursor:pointer;font-weight:700}
button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{background:var(--gold);color:#241a00;border:0}
.ghost{background:transparent}.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.mute{color:var(--mute);font-size:13px}
.bar{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;text-decoration:none;color:var(--text)}.logo b{color:var(--gold)}
.bar nav{display:flex;gap:6px;margin-right:auto}
.bar nav a{padding:8px 14px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:700}
.bar nav a.on{background:var(--surface);color:var(--text)}
#who{display:flex;gap:10px;align-items:center}
.me{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 12px 5px 6px}
.av{width:32px;height:32px;border-radius:9px;background:var(--violet);display:grid;place-items:center;font-weight:800;font-family:Outfit,sans-serif}
.me small{display:block;color:var(--gold);font-size:12px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:20px;padding:20px 24px;max-width:1560px;margin:0 auto;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.side{position:sticky;top:12px}
.panel h3{font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel h4{margin:16px 0 8px;font-size:13px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:10px;padding:5px 2px;cursor:pointer;font-weight:700;font-size:14px}
.chk input{accent-color:var(--gold);width:16px;height:16px;padding:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.seg{display:grid;gap:6px}.seg button{text-align:left;background:var(--raise)}.seg button.on{background:var(--violet);border-color:var(--violet)}
.banner{border-radius:16px;padding:34px 30px;background:radial-gradient(circle at 85% 20%,#8b6cff55,transparent 45%),linear-gradient(120deg,#2a1f55,#16122b 70%);border:1px solid var(--line)}
.banner h1{font-size:clamp(26px,4vw,44px);font-weight:800;letter-spacing:-1px}
.banner p{color:var(--mute);margin:8px 0 18px;max-width:480px}
.ticker{margin:14px 0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center}
.live{background:#4ade8022;color:#4ade80;font-weight:800;font-size:12px;padding:6px 12px;margin:6px;border-radius:99px;flex:none}
.track{display:flex;gap:28px;white-space:nowrap;animation:slide 40s linear infinite;padding:10px 0;font-size:14px;font-weight:700}
.track em{font-style:normal;color:var(--gold)}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tools input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.art{height:130px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%),var(--raise);color:var(--c)}
.art svg{width:64px;height:64px}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:#0008;border:1px solid var(--c);color:#fff}
.kind{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px}
.k-sell{background:#4ade8033;color:#4ade80}.k-buy{background:#8b6cff40;color:#c4b5ff}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:17px;line-height:1.2}
.want{background:var(--raise);border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.want small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.desc{margin:0;color:var(--mute);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}.acts .btn{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--mute)}
.cart{position:sticky;top:12px;display:flex;flex-direction:column;min-height:360px}
.lines{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:50vh}
.none{margin:auto;text-align:center;color:var(--mute);font-size:14px;padding:40px 0}
.line{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700}
.line span{flex:1;overflow-wrap:anywhere}.line button{padding:2px 8px;background:transparent}
.cart .foot{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:grid;gap:8px}
dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(420px,92vw);padding:24px}
dialog::backdrop{background:#000b}dialog form{display:flex;flex-direction:column;gap:10px}
.err{color:var(--bad);font-size:14px;min-height:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4ade80;color:#06240f;padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.soon{opacity:.6;cursor:not-allowed}
.soon i{font-style:normal;font-size:10px;font-weight:800;background:var(--raise);color:var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px}
.wallet{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.wallet span{padding:9px 16px;font-weight:800}.wallet button{border:0;border-radius:0;padding:9px 14px;background:var(--raise)}
.me{cursor:pointer;color:var(--text);text-align:left}
.pt{display:flex;gap:14px;align-items:center}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.pstats div{background:var(--surface);border-radius:10px;padding:10px;text-align:center;font-family:Outfit,sans-serif;font-size:22px;font-weight:700}
.pstats span{display:block;font-family:Manrope,sans-serif;font-size:12px;color:var(--mute);font-weight:500}
.rows{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;margin:8px 0 12px}
.rw{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px}.rw .mute{margin-left:auto}
@media (max-width:1100px){.layout{grid-template-columns:1fr}.side,.cart{position:static}}
</style>
</head>
<body>
<div class="bar">
  <a class="logo" href="/">Splitz<b>Market</b></a>
  <nav><a class="on" href="/">Shop</a><a href="/board.html">Board &amp; chat</a><a href="/support.html">Support</a></nav>
  <button class="soon" data-t="Withdrawals are coming soon" aria-disabled="true">Withdraw <i>Soon</i></button>
  <div class="wallet"><span>$0.00</span><button class="soon" data-t="Deposits are coming soon" aria-disabled="true" aria-label="Add funds (coming soon)">+</button></div>
  <div id="who"></div>
</div>

<div class="layout">
  <aside class="panel side">
    <h3>Filters <button class="ghost sm" id="reset">Reset</button></h3>
    <h4>Looking for</h4>
    <div class="seg" id="kinds"></div>
    <h4>Category</h4><div id="cats"></div>
  </aside>

  <main>
    <section class="banner">
      <h1>Find your next MM2 trade.</h1>
      <p>Real offers from real players. Find what you want, then message them on Discord.</p>
      <button class="btn" id="heroPost">Post a listing</button>
    </section>
    <div class="ticker"><span class="live">LIVE</span><div class="track" id="track"></div></div>
    <div class="tools">
      <input id="q" placeholder="Quick search" aria-label="Quick search">
      <select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Name: A to Z</option></select>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <aside class="panel cart">
    <h3>Your cart</h3>
    <div class="lines" id="lines"></div>
    <div class="foot" id="cartFoot"></div>
  </aside>
</div>

<dialog id="postDlg"><form id="postForm">
  <h2>New listing</h2>
  <select name="kind"><option value="sell">I'm selling</option><option value="buy">I'm buying</option></select>
  <input name="item" placeholder="Item name" maxlength="60" required>
  <select name="category"><option>Godly</option><option>Ancient</option><option>Chroma</option><option>Vintage</option><option>Pet</option><option>Set</option><option>Other</option></select>
  <input name="price" placeholder="Asking for (e.g. 2 Harvesters)" maxlength="40" required>
  <input name="discord" placeholder="Your Discord username" maxlength="40" required>
  <textarea name="description" placeholder="Details (optional)" maxlength="300" rows="3"></textarea>
  <div class="err" id="err2"></div>
  <button class="btn">Post listing</button>
  <button type="button" class="ghost" onclick="postDlg.close()">Cancel</button>
</form></dialog>
<dialog id="profileDlg">
  <div class="pt"><div id="pAv"></div><div><h2 id="pName" style="margin:0"></h2><div class="mute" id="pSub"></div></div></div>
  <div class="pstats"><div id="pOpen">0<span>Open listings</span></div><div id="pDone">0<span>Trades done</span></div><div id="pMsgs">0<span>Chat messages</span></div></div>
  <h3 style="font-size:16px">Your listings</h3>
  <div class="rows" id="pList"></div>
  <p class="mute" id="pNext" style="margin:0 0 12px"></p>
  <button class="ghost" id="pOut">Log out</button> <button class="ghost" onclick="profileDlg.close()">Close</button>
</dialog>
<div id="toast" role="status"></div>

<script src="/auth.js"></script>
<script>
const $ = (id) => document.getElementById(id);
if (typeof avEl === 'undefined') window.avEl = (u) => { const s = document.createElement('span'); s.className = 'av'; s.textContent = u.username[0].toUpperCase(); return s; };
if (typeof RbxAuth === 'undefined') window.RbxAuth = { open() { toast('Login script missing. Add public/auth.js on GitHub, then refresh.'); } };
const el = (t, p = {}, ...k) => { const e = document.createElement(t); Object.assign(e, p); k.forEach((x) => e.append(x)); return e; };
const toast = (t) => { const x = $('toast'); x.textContent = t; x.classList.add('show'); setTimeout(() => x.classList.remove('show'), 1800); };
const ago = (d) => { const s = (Date.now() - new Date(d)) / 1000; return s < 3600 ? Math.max(1, Math.floor(s / 60)) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago'; };
async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}
const copy = (t) => navigator.clipboard.writeText(t).then(() => toast('Copied ' + t));

const CC = { Godly: '#d94fd0', Ancient: '#7c5cff', Chroma: '#b78bff', Vintage: '#d9b98a', Pet: '#7ee787', Set: '#7cb8ff', Other: '#b9b6d4' };
const ICON = {
  Knife: '<svg viewBox="0 0 64 64"><path d="M14 54 40 10l8 5-24 42z" fill="currentColor"/><rect x="8" y="46" width="16" height="6" rx="2" fill="currentColor" opacity=".55" transform="rotate(-30 16 49)"/></svg>',
  Gun: '<svg viewBox="0 0 64 64"><path d="M6 22h42v11H31l-4 17H15l3-17H6z" fill="currentColor"/></svg>',
  Pet: '<svg viewBox="0 0 64 64"><circle cx="32" cy="38" r="16" fill="currentColor"/><circle cx="19" cy="17" r="7" fill="currentColor"/><circle cx="45" cy="17" r="7" fill="currentColor"/></svg>',
  Misc: '<svg viewBox="0 0 64 64"><path d="m32 6 8 18h19L44 36l5 20-17-11-17 11 5-20L5 24h19z" fill="currentColor"/></svg>'
};
const iconFor = (l) => l.category === 'Pet' ? 'Pet' : ['Set', 'Other'].includes(l.category) ? 'Misc' : /gun|scope|cannon|blaster|pistol|rifle|sniper|shot|laser|bow/i.test(l.item) ? 'Gun' : 'Knife';

const seller = new URLSearchParams(location.search).get('seller');
let me = null, signup = false, rows = [], kind = '', cats = new Set(), saved = [], myRank = '';
try { saved = JSON.parse(localStorage.getItem('saved') || '[]'); } catch {}
const persist = () => { try { localStorage.setItem('saved', JSON.stringify(saved)); } catch {} draw(); drawSaved(); };
const toggleSave = (l) => { const i = saved.findIndex((s) => s.id === l.id); i >= 0 ? saved.splice(i, 1) : saved.push({ id: l.id, item: l.item, kind: l.kind, price: l.price, discord: l.discord }); persist(); };

[['', 'All listings'], ['sell', 'Selling'], ['buy', 'Buying']].forEach(([k, label]) => {
  const b = el('button', { textContent: label, className: k === kind ? 'on' : '', onclick: () => { kind = k; [...$('kinds').children].forEach((x) => x.classList.toggle('on', x === b)); draw(); } });
  $('kinds').append(b);
});
Object.keys(CC).forEach((c) => {
  const cb = el('input', { type: 'checkbox', onchange: () => { cb.checked ? cats.add(c) : cats.delete(c); draw(); } });
  const dot = el('span', { className: 'dot' }); dot.style.setProperty('--c', CC[c]);
  $('cats').append(el('label', { className: 'chk' }, cb, dot, c));
});
$('reset').onclick = () => { kind = ''; cats.clear(); $('q').value = ''; document.querySelectorAll('#cats input').forEach((c) => (c.checked = false)); [...$('kinds').children].forEach((x, i) => x.classList.toggle('on', i === 0)); draw(); };
$('q').oninput = draw; $('sort').onchange = draw;
$('kinds').firstChild.classList.add('on');

function draw() {
  const q = $('q').value.toLowerCase(), s = $('sort').value;
  const list = rows.filter((l) => l.item.toLowerCase().includes(q) && (!seller || l.username.toLowerCase() === seller.toLowerCase()) && (!kind || l.kind === kind) && (!cats.size || cats.has(l.category)));
  list.sort((a, b) => s === 'az' ? a.item.localeCompare(b.item) : s === 'old' ? new Date(a.created_at) - new Date(b.created_at) : new Date(b.created_at) - new Date(a.created_at));
  const g = $('grid'); g.replaceChildren();
  if (!list.length) g.append(el('div', { className: 'empty', textContent: rows.length ? 'No listings match these filters. Try resetting them.' : 'No listings yet. Post the first one and it will show up here.' }));
  list.forEach((l) => {
    const art = el('div', { className: 'art' }, el('span', { className: 'badge', textContent: l.category.toUpperCase() }), el('span', { className: 'kind ' + (l.kind === 'sell' ? 'k-sell' : 'k-buy'), textContent: l.kind === 'sell' ? 'SELLING' : 'BUYING' }));
    art.insertAdjacentHTML('beforeend', ICON[iconFor(l)]);
    const acts = el('div', { className: 'acts' });
    if (me && me.id === l.user_id) {
      acts.append(soonBtn('Mark done'), soonBtn('Delete'));
    } else {
      acts.append(soonBtn('Buy', 'btn sm'), soonBtn('Save'));
    }
    const card = el('article', { className: 'card' }, art, el('div', { className: 'info' },
      el('h3', { textContent: l.item }),
      el('div', { className: 'mute', textContent: 'by ' + l.username + ' · ' + ago(l.created_at) }),
      el('div', { className: 'want' }, el('small', { textContent: l.kind === 'sell' ? 'Wants' : 'Offering' }), l.price),
      l.description ? el('p', { className: 'desc', textContent: l.description }) : '', acts));
    card.style.setProperty('--c', CC[l.category] || CC.Other);
    g.append(card);
  });
  const t = rows.slice(0, 12).map((l) => `<span>${esc(l.item)} <em>${esc(l.price)}</em></span>`).join('');
  $('track').innerHTML = rows.length ? t + t : '<span class="mute">Waiting for the first listing</span>';
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function drawSaved() {
  $('lines').replaceChildren(el('div', { className: 'none' }, el('b', { textContent: 'Cart is coming soon' }), el('br'), 'Buying and saving items will open here once checkout is ready.'));
  $('cartFoot').replaceChildren(soonBtn('Buy now', 'btn'));
}



function drawWho() {
  const w = $('who'); w.replaceChildren();
  if (me) {
    w.append(soonBtn('Post listing', 'btn sm'),
      RbxAuth.menu(me, async () => { await api('/api/logout', 'POST'); me = null; drawWho(); load(); }));
  } else {
    w.append(el('button', { className: 'btn sm', textContent: 'Log in with Roblox', onclick: openAuth }));
  }
}
function openAuth() { RbxAuth.open((u) => { me = u; drawWho(); load(); }); }
$('heroPost').replaceWith(soonBtn('Post a listing', 'btn'));
$('postForm').onsubmit = async (e) => {
  e.preventDefault();
  try { await api('/api/listings', 'POST', Object.fromEntries(new FormData(e.target))); postDlg.close(); e.target.reset(); $('err2').textContent = ''; toast('Listing posted'); load(); }
  catch (x) { $('err2').textContent = x.message; }
};

async function openProfile() {
  let p;
  try { p = await api('/api/profile'); } catch (e) { return toast(e.message); }
  myRank = p.rank;
  const av = avEl(me); av.style.width = av.style.height = '56px'; av.style.fontSize = '24px';
  $('pAv').replaceChildren(av);
  $('pName').textContent = p.username;
  $('pSub').textContent = p.rank + ' · joined ' + new Date(p.joined).toLocaleDateString();
  $('pOpen').firstChild.textContent = p.open; $('pDone').firstChild.textContent = p.done; $('pMsgs').firstChild.textContent = p.messages;
  const next = p.done >= 15 ? null : p.done >= 5 ? [15, 'Broker'] : p.done >= 1 ? [5, 'Dealer'] : [1, 'Trader'];
  $('pNext').textContent = next ? 'Mark ' + (next[0] - p.done) + ' more listing(s) as done to reach ' + next[1] + '.' : 'You reached the top rank.';
  const box = $('pList'); box.replaceChildren();
  if (!p.listings.length) box.append(el('p', { className: 'mute', textContent: 'You have not posted anything yet.' }));
  p.listings.forEach((l) => box.append(el('div', { className: 'rw' }, el('span', { textContent: l.item }), el('span', { className: 'mute', textContent: (l.kind === 'sell' ? 'Selling' : 'Buying') + ' · ' + (l.status === 'done' ? 'Done' : 'Open') }))));
  profileDlg.showModal();
}
$('pOut').onclick = async () => { await api('/api/logout', 'POST'); me = null; myRank = ''; profileDlg.close(); drawWho(); load(); };

async function load() { try { rows = await api('/api/listings'); } catch {} draw(); }
api('/api/me').then((u) => { me = u; try { drawWho(); } catch (e) { console.error(e); } load(); }).catch(() => { drawWho(); load(); });
setInterval(load, 30000);
drawSaved();
if (seller) { document.querySelector('.banner h1').textContent = seller + "'s shop"; document.querySelector('.banner p').textContent = 'Every open listing from this player.'; }
document.querySelectorAll('.soon').forEach((b) => (b.onclick = () => toast(b.dataset.t)));
</script>
</body>
</html>
