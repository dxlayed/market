<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Owner panel | SplitzMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0707;--surface:#140c0c;--raise:#1e1111;--line:#3a1717;--text:#f6efee;--mute:#a88a88;--gold:#e8202a;--violet:#8f0d14;--ok:#4ade80;--bad:#ff7a45}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3,.logo{font-family:Outfit,system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{resize:vertical;width:100%}
button{cursor:pointer;font-weight:700}
button:focus-visible,input:focus,textarea:focus,select:focus,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button:disabled{opacity:.6;cursor:wait}
.btn{background:var(--gold);color:#fff;border:0}.ghost{background:transparent}.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.danger{color:var(--bad);border-color:#ff7a4566}.danger.arm{background:var(--bad);color:#2a0606;border-color:var(--bad)}
.mute{color:var(--mute);font-size:13px}
a{color:var(--gold)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;text-decoration:none;color:var(--text)}.logo b{color:var(--gold)}
.badge{font-size:11px;font-weight:800;background:#e8202a26;color:var(--gold);border-radius:6px;padding:3px 8px;margin-right:auto}
.av{width:32px;height:32px;border-radius:9px;background:var(--violet);display:grid;place-items:center;font-weight:800;font-family:Outfit,sans-serif;flex:none}
.wrap{max-width:1240px;margin:0 auto;padding:24px 24px 60px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:4px;position:sticky;top:12px}
.side button{text-align:left;background:transparent;border:0;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.side button.on{background:var(--gold);color:#fff}
.side button:hover:not(.on){background:var(--raise);color:var(--text)}
.side i{font-style:normal;font-size:11px;background:var(--bad);color:#2a0606;border-radius:99px;padding:1px 7px}
.side button.on i{background:#fff;color:var(--gold)}
h1{font-size:28px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.card h2{font-size:18px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:Outfit,sans-serif;font-size:30px;font-weight:700}
.stats span{display:block;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.stats em{display:block;font-style:normal;font-family:Manrope,sans-serif;font-size:12px;color:var(--mute);font-weight:500;margin-top:4px}
.stats .hot{border-color:#e8202a88}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{flex:1;min-width:200px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.who{display:flex;gap:10px;align-items:center;font-weight:700}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--raise);color:var(--mute);white-space:nowrap}
.pill.ok{background:#4ade8022;color:var(--ok)}.pill.bad{background:#ff7a4526;color:var(--bad)}.pill.gold{background:#e8202a26;color:var(--gold)}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.tk{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:var(--text)}
.tk.on{border-color:var(--gold)}
.tk b{display:block;margin-bottom:4px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thread{display:flex;flex-direction:column;min-height:480px}
.thead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}
.thead h2{margin:0;overflow-wrap:anywhere}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px 0;overflow-y:auto;max-height:58vh}
.msg{max-width:80%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.msg.staff{align-self:flex-end;background:#e8202a1a;border-color:#e8202a66}
.msg small{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:700}
.reply{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.reply textarea{flex:1;min-width:0}
.chat{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chat:last-child{border-bottom:0}
.chat p{margin:2px 0 0;overflow-wrap:anywhere;flex:1}
.chat .acts{display:flex;gap:6px;flex:none}
.empty{text-align:center;color:var(--mute);padding:36px 16px}
.feerow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.feerow:first-of-type{border-top:0}
.feerow .grow{flex:1;min-width:0}.feerow b{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;padding:0;background:var(--raise);border:1px solid var(--line);flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#8a7a7a;transition:transform .18s,background .18s}
.sw.on{background:#e8202a55;border-color:var(--gold)}.sw.on i{transform:translateX(20px);background:#fff}
.bothd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bothd .bav{width:64px;height:64px;border-radius:16px;background:#2a1616 center/cover;border:1px solid var(--line);display:grid;place-items:center;font:900 26px Outfit,sans-serif;color:var(--gold);position:relative;flex:none}
.bothd .bav i{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:99px;background:#6b6b6b;border:3px solid var(--surface)}
.bothd.on .bav i{background:var(--ok)}
.bothd h2{margin:0;font-size:22px}.bothd .grow{flex:1;min-width:200px}
.ithumb{width:38px;height:38px;border-radius:9px;background:#0d0707;object-fit:contain;flex:none}
.irow{display:flex;align-items:center;gap:10px;font-weight:700}
.diff{font-weight:800}.diff.ok{color:var(--ok)}.diff.bad{color:var(--bad)}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:12px}
.invgrid>div{display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.invgrid>div .nm{flex:1;min-width:0}.invgrid>div b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picklist{max-height:240px;overflow:auto;display:grid;gap:4px;margin-top:8px}
.picklist button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--raise);font-weight:600}
.picklist button.on{border-color:var(--gold);background:#e8202a1c}
.denied{grid-column:1/-1;text-align:center;padding:90px 20px}
.maint{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.maint.on{border-color:var(--gold);background:linear-gradient(90deg,#e8202a22,var(--surface) 60%)}
.maint h2{margin-bottom:4px}.maint p{max-width:60ch}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06240f;padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr auto;gap:8px;align-items:center}
.form input,.form select{min-width:0;width:100%}
.thumb{width:36px;height:36px;border-radius:8px;background:var(--raise);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{max-width:100%;max-height:100%}
.thumb.up{padding:0;border:1px dashed #5a1f1f;cursor:pointer;color:var(--mute);font-size:18px;font-weight:800}
.thumb.up:hover{border-color:var(--gold);color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--c)}
.code{font-family:Outfit,sans-serif;letter-spacing:2px;color:var(--gold);font-size:17px}
.tag{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
details.raw summary{cursor:pointer;color:var(--mute);font-size:12px}
details.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:var(--mute);margin:6px 0 0}
@media (max-width:980px){.form{grid-template-columns:1fr 1fr}}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.side{position:static;grid-auto-flow:column;overflow-x:auto}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}

body{background:radial-gradient(ellipse 90% 60% at 50% -10%,#3a0a0d 0%,transparent 60%) fixed,var(--bg)}
.logo b{color:var(--gold);text-shadow:0 0 18px #e8202a88}
.btn{transition:filter .15s,box-shadow .15s}.btn:hover{filter:brightness(1.12);box-shadow:0 0 20px #e8202a55}
.card,.panel{transition:border-color .15s}.card:hover,.panel:hover{border-color:#5a1f1f}
::selection{background:#e8202a;color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a1717;border-radius:99px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="bar">
  <a class="logo" href="/">Splitz<b>Market</b></a>
  <span class="badge" id="badge" hidden>Owner panel</span>
  <div id="who"></div>
</div>
<div class="wrap" id="wrap"><div class="card mute" style="grid-column:1/-1">Loading...</div></div>
<div id="toast" role="status"></div>

<script src="/auth.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const el = (t, p = {}, ...k) => { const e = document.createElement(t); for (const [a, v] of Object.entries(p)) { if (a.includes('-')) e.setAttribute(a, v); else e[a] = v; } k.forEach((x) => x != null && e.append(x)); return e; };
const toast = (t, bad) => { const x = $('toast'); x.textContent = t; x.style.background = bad ? 'var(--bad)' : ''; x.classList.add('show'); setTimeout(() => x.classList.remove('show'), 2200); };
const when = (d) => new Date(d).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Something went wrong'); e.status = r.status; throw e; }
  return d;
}
// Two-click confirm instead of a browser popup.
function armed(label, armedLabel, run, cls = 'ghost sm danger') {
  const b = el('button', { className: cls, textContent: label });
  let t = null;
  b.onclick = async () => {
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = armedLabel; t = setTimeout(() => { b.classList.remove('arm'); b.textContent = label; }, 3000); return; }
    clearTimeout(t); b.disabled = true;
    try { await run(); } catch (e) { toast(e.message, true); b.disabled = false; b.classList.remove('arm'); b.textContent = label; }
  };
  return b;
}
const userCell = (name, avatar) => el('span', { className: 'who' }, avEl({ username: name || '?', avatar }), name || 'deleted');

let me = null, tab = 'overview', stats = null, poll = null;
const TABS = [['overview', 'Overview'], ['trades', 'Trades'], ['bot', 'Bot'], ['market', 'Market'], ['crypto', 'Crypto'], ['users', 'Users & balances'], ['support', 'Support chats'], ['chat', 'Live chat'], ['items', 'Items'], ['logs', 'Logs']];
const usd = (c) => window.money ? window.money(c) : '$' + (c / 100).toFixed(2);

function shell() {
  const side = el('aside', { className: 'side', id: 'side' });
  $('wrap').replaceChildren(side, el('main', { id: 'main' }));
  drawSide();
}
function drawSide() {
  $('side').replaceChildren(...TABS.map(([k, label]) => el('button', { className: tab === k ? 'on' : '', onclick: () => go(k) },
    label, k === 'support' && stats && stats.waiting ? el('i', { textContent: stats.waiting }) : k === 'trades' && stats && stats.activeTrades ? el('i', { textContent: stats.activeTrades }) : k === 'crypto' && stats && stats.withdrawalsPending ? el('i', { textContent: stats.withdrawalsPending }) : null)));
}
async function go(k) {
  tab = k; clearInterval(poll); drawSide();
  try { await ({ overview, users, support, chat, market, crypto: cryptoTab, items, trades, logs, bot: botTab })[k](); }
  catch (e) { $('main').replaceChildren(el('div', { className: 'card', textContent: e.message })); }
}
async function refreshStats() { stats = await api('/api/admin/stats'); drawSide(); }

async function overview() {
  await refreshStats();
  const s = stats;
  const tile = (label, n, sub, hot) => el('div', { className: hot ? 'hot' : '' }, el('span', { textContent: label }), String(n), sub ? el('em', { textContent: sub }) : null);
  const waiting = await api('/api/admin/tickets');
  const list = el('div', {});
  const need = waiting.filter((t) => !t.last_staff);
  if (!need.length) list.append(el('p', { className: 'mute', textContent: 'Nobody is waiting on a reply.' }));
  need.slice(0, 8).forEach((t) => list.append(el('button', { className: 'tk', onclick: () => { go('support').then(() => openTicket(t.id)); } },
    el('b', { textContent: t.subject }), el('span', { className: 'mute', textContent: t.username + ' · ' + when(t.updated_at) }))));
  const set = await api('/api/admin/settings');
  const mBtn = armed(set.maintenance ? 'Turn maintenance off' : 'Turn maintenance on', set.maintenance ? 'Confirm: open the site' : 'Confirm: close the site', async () => {
    await api('/api/admin/settings', 'POST', { maintenance: !set.maintenance });
    toast(set.maintenance ? 'Site is open to everyone again' : 'Maintenance mode is on');
    setTimeout(() => location.reload(), 600);
  }, set.maintenance ? 'btn' : 'ghost danger');
  const maint = el('section', { className: 'card maint' + (set.maintenance ? ' on' : ''), id: 'maintenance' },
    el('div', {}, el('h2', { textContent: set.maintenance ? 'Maintenance mode is on' : 'Site is open' }),
      el('p', { className: 'mute', style: 'margin:0', textContent: set.maintenance
        ? 'Regular players see the maintenance page with the Discord link. Owners still see everything, so you can check updates before opening up.'
        : 'Turn on maintenance to hide the site from regular players while you work on it. Owners keep full access.' })),
    mBtn);
  $('main').replaceChildren(el('h1', { textContent: 'Overview' }), maint, feesCard(set),
    el('div', { className: 'stats' },
      tile('Users', s.users, s.newUsers + ' joined in the last 24h'),
      tile('Waiting on reply', s.waiting, s.openTickets + ' open tickets', s.waiting > 0),
      tile('Chat messages', s.messages, s.messagesToday + ' in the last 24h'),
      tile('Active trades', s.activeTrades, s.itemsHeld + ' items held on site', s.activeTrades > 0),
      tile('Sales (24h)', usd(s.volume24), s.sales24 + ' items sold'),
      tile('Fees earned (24h)', usd(s.fees24), usd(s.feesAll) + ' all time'),
      tile('For sale', s.listings, 'active listings'),
      tile('Balances owed', usd(s.balances), 'total of everyone\'s balance'),
      tile('Withdrawals to send', s.withdrawalsPending, 'in the Crypto tab', s.withdrawalsPending > 0),
      tile('Banned users', s.banned, '')),
    el('section', { className: 'card' }, el('h2', { textContent: 'Tickets waiting on you' }), list),
    el('p', { className: 'mute', textContent: 'Owners: ' + s.owners.join(', ') + '. Change this with the OWNERS variable in Railway. Trading API: ' + (s.apiEnabled ? 'on' : 'off (set BOT_API_KEY in Railway)') + '.' }));
}

// Site fees: two switches, each with its own percent.
function feesCard(set) {
  const row = (key, title, desc) => {
    const cur = set[key] || { on: false, pct: 5 };
    const pct = el('input', { type: 'number', min: 0, max: 50, step: 0.5, value: cur.pct, style: 'width:80px', 'aria-label': title + ' percent' });
    const sw = el('button', { type: 'button', className: 'sw' + (cur.on ? ' on' : ''), role: 'switch', 'aria-checked': String(cur.on), 'aria-label': title }, el('i'));
    const state = el('span', { className: 'pill ' + (cur.on ? 'ok' : ''), textContent: cur.on ? 'On' : 'Off' });
    const save = async (on) => {
      sw.disabled = true;
      try {
        const r = await api('/api/admin/settings', 'POST', { [key]: { on, pct: pct.value } });
        Object.assign(set, r); const n = r[key];
        sw.classList.toggle('on', n.on); sw.setAttribute('aria-checked', String(n.on)); state.className = 'pill ' + (n.on ? 'ok' : ''); state.textContent = n.on ? 'On' : 'Off'; pct.value = n.pct;
        toast(title + (n.on ? ' on at ' + n.pct + '%' : ' off'));
      } catch (e) { toast(e.message, true); }
      sw.disabled = false;
    };
    sw.onclick = () => save(!sw.classList.contains('on'));
    pct.onchange = () => save(sw.classList.contains('on'));
    return el('div', { className: 'feerow' }, sw, el('div', { className: 'grow' }, el('b', {}, title, ' ', state), el('div', { className: 'mute', textContent: desc })), el('label', { className: 'mute', style: 'display:flex;align-items:center;gap:6px' }, pct, '%'));
  };
  return el('section', { className: 'card' }, el('h2', { textContent: 'Site fees' }),
    row('sale_tax', 'Fee on item sales', 'Taken from the seller when an item sells. Buyers pay the listed price; sellers get the rest.'),
    row('withdraw_tax', 'Fee on withdrawals', 'Taken from crypto withdrawals of balance, on top of the network fee.'));
}

async function users() {
  const q = el('input', { placeholder: 'Search by Roblox username' });
  const body = el('tbody');
  const table = el('div', { className: 'card scroll' }, el('table', { className: 'tbl' },
    el('thead', {}, el('tr', {}, ...['User', 'Roblox ID', 'Joined', 'Balance', 'Items', 'For sale', 'Status', ''].map((h) => el('th', { textContent: h })))), body));
  async function load() {
    const rows = await api('/api/admin/users?q=' + encodeURIComponent(q.value));
    body.replaceChildren();
    if (!rows.length) body.append(el('tr', {}, el('td', { colSpan: 8, className: 'empty', textContent: 'No users found.' })));
    rows.forEach((u) => {
      const status = u.owner ? el('span', { className: 'pill gold', textContent: 'Owner' }) : u.banned ? el('span', { className: 'pill bad', textContent: 'Banned' }) : el('span', { className: 'pill ok', textContent: 'Active' });
      const act = u.owner ? '' : u.banned
        ? el('button', { className: 'ghost sm', textContent: 'Unban', onclick: async () => { await api(`/api/admin/users/${u.id}/ban`, 'POST', { banned: false }); toast('Unbanned ' + u.username); load(); } })
        : armed('Ban', 'Confirm ban', async () => { await api(`/api/admin/users/${u.id}/ban`, 'POST', { banned: true }); toast('Banned ' + u.username); load(); });
      body.append(el('tr', {},
        el('td', {}, userCell(u.username, u.avatar_url)),
        el('td', {}, u.roblox_id ? el('a', { href: 'https://www.roblox.com/users/' + u.roblox_id + '/profile', target: '_blank', rel: 'noopener', textContent: u.roblox_id }) : el('span', { className: 'mute', textContent: 'Not verified' })),
        el('td', { className: 'mute', textContent: when(u.created_at) }),
        el('td', {}, el('b', { textContent: usd(u.balance_cents) })), el('td', { textContent: u.items }), el('td', { textContent: u.listings }),
        el('td', {}, status), el('td', { style: 'white-space:nowrap' }, el('button', { className: 'ghost sm', textContent: 'Balance', onclick: () => adjust(u, load) }), ' ', el('button', { className: 'ghost sm', textContent: 'Items', onclick: () => invEditor(u, load) }), ' ', act)));
    });
  }
  let t; q.oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
  $('main').replaceChildren(el('h1', { textContent: 'Users & balances' }),
    el('p', { className: 'mute', textContent: 'Balance adds or removes funds. Items lets you add items to someone\'s inventory (for testing or fixing a missed deposit) or remove them. Every change is saved in Logs.' }),
    el('div', { className: 'tools' }, q), el('div', { id: 'adjust' }), table);
  await load();
}

let curTicket = null, lastCount = -1;
async function support() {
  const filter = el('select', {}, el('option', { value: 'open', textContent: 'Open tickets' }), el('option', { value: 'closed', textContent: 'Closed tickets' }), el('option', { value: 'all', textContent: 'All tickets' }));
  const list = el('div', { id: 'tlist' });
  const thread = el('section', { className: 'card thread', id: 'thread' }, el('div', { className: 'empty', textContent: 'Pick a ticket to read and reply.' }));
  async function loadList() {
    const rows = await api('/api/admin/tickets?status=' + filter.value);
    list.replaceChildren();
    if (!rows.length) list.append(el('p', { className: 'mute', textContent: 'No tickets here.' }));
    rows.forEach((t) => list.append(el('button', { className: 'tk' + (curTicket === t.id ? ' on' : ''), onclick: () => openTicket(t.id) },

function pickImage(item, done) {
  const f = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp' });
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      const img = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(file); });
      const max = 256, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let data = c.toDataURL('image/webp', 0.9); if (!data.startsWith('data:image/webp')) data = c.toDataURL('image/png');
      await api('/api/admin/items/' + item.id + '/image', 'POST', { data });

    } catch (e) { toast(e.message || 'Could not read that picture', true); }
  };
  f.click();

            el('div', { className: 'mute' }, 'Roblox user ', t.roblox_id ? el('a', { href: 'https://www.roblox.com/users/' + t.roblox_id + '/profile', target: '_blank', rel: 'noopener', textContent: t.roblox_username }) : (t.roblox_username || 'deleted'),
              ' · ' + when(t.created_at) + (t.handled_by ? ' · handled by ' + t.handled_by : ''))),
          el('div', { className: 'row' }, el('span', { className: 'code', textContent: t.code }), el('span', { className: 'pill ' + (cls[t.status] || ''), textContent: label[t.status] || t.status }))),
        el('p', { style: 'margin:12px 0', textContent: names }),
        acts));
    });
  }
  filter.onchange = load;
  $('main').replaceChildren(el('h1', { textContent: 'Trades' }),
    el('p', { className: 'mute', textContent: 'Check the Roblox username and code before every trade. Completing a deposit adds the listed items to the user\'s inventory. Failing a withdrawal gives their items back.' }),
    el('div', { className: 'tools' }, filter), body);
  await load();
  poll = setInterval(() => { load().catch(() => {}); refreshStats().catch(() => {}); }, 8000);
}

async function logs() {
  const q = el('input', { placeholder: 'Search by username, trade:12, item name...' });
  const type = el('select', {}, ...[['', 'Everything'], ['trade', 'Trades'], ['user', 'Users and logins'], ['item', 'Items'], ['ticket', 'Tickets'], ['chat', 'Chat'], ['market', 'Market'], ['balance', 'Balances'], ['site', 'Maintenance'], ['crypto', 'Crypto']].map(([v, t]) => el('option', { value: v, textContent: t })));
  const body = el('tbody');
  const nice = (a) => a.replace('.', ' ').replace(/_/g, ' ');
  async function load() {
    const rows = await api('/api/admin/logs?q=' + encodeURIComponent(q.value) + '&type=' + type.value);
    body.replaceChildren();
    if (!rows.length) body.append(el('tr', {}, el('td', { colSpan: 4, className: 'empty', textContent: 'Nothing logged yet.' })));
    rows.forEach((l) => body.append(el('tr', {},
      el('td', { className: 'mute', style: 'white-space:nowrap', textContent: when(l.created_at) }),
      el('td', {}, el('b', { textContent: l.actor })),
      el('td', {}, nice(l.action), l.target ? el('div', { className: 'tag', textContent: l.target }) : null),
      el('td', {}, l.detail ? el('details', { className: 'raw' }, el('summary', { textContent: 'Details' }), el('pre', { textContent: JSON.stringify(l.detail, null, 2) })) : ''))));
  }
  let t; q.oninput = () => { clearTimeout(t); t = setTimeout(load, 250); }; type.onchange = load;
  $('main').replaceChildren(el('h1', { textContent: 'Logs' }),
    el('p', { className: 'mute', textContent: 'Every login, trade, ban, item change and deletion, newest first. Use this to settle disputes or work out who to compensate.' }),
    el('div', { className: 'tools' }, q, type),
    el('div', { className: 'card scroll' }, el('table', { className: 'tbl' }, el('thead', {}, el('tr', {}, ...['When', 'Who', 'What', ''].map((h) => el('th', { textContent: h })))), body)));
  await load();
}

// ---------- Inventory editor (Users tab → Items) ----------
const RCO = { Chroma: '#b78bff', Ancient: '#7c5cff', Godly: '#d94fd0', Unique: '#e6b422', Vintage: '#d9b98a', Legendary: '#ff4d4d', Rare: '#2fb36a', Uncommon: '#4d7cff', Common: '#8a8fa3' };
const okImg = (u) => u && /^(https:\/\/|\/img\/item\/|\/items\/)/.test(u);
const thumb = (i) => okImg(i.image_url) ? el('img', { className: 'ithumb', src: i.image_url, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer' }) : el('span', { className: 'ithumb' });
let catalogCache = null;
async function invEditor(u, done) {
  if (!catalogCache) catalogCache = await api('/api/items');
  const box = el('section', { className: 'card' });
  let chosen = null;
  const search = el('input', { placeholder: 'Search an item to add, e.g. Harvester' });
  const list = el('div', { className: 'picklist' });
  const qty = el('input', { type: 'number', min: 1, max: 50, value: 1, style: 'width:90px' });
  const note = el('input', { placeholder: 'Note (optional)', maxLength: 120 });
  const addBtn = el('button', { className: 'btn', textContent: 'Add to inventory', disabled: true });
  const invBox = el('div', { className: 'invgrid' });
  function drawPick() {
    const q = search.value.trim().toLowerCase();
    const rows = catalogCache.filter((i) => !q || i.name.toLowerCase().includes(q)).slice(0, 40);
    list.replaceChildren(...rows.map((i) => el('button', { type: 'button', className: chosen && chosen.id === i.id ? 'on' : '', onclick: () => { chosen = i; addBtn.disabled = false; addBtn.textContent = 'Add ' + i.name; drawPick(); } },
      thumb(i), el('span', { style: 'flex:1' }, i.name), el('span', { className: 'pill', style: 'color:' + (RCO[i.rarity] || RCO.Common), textContent: i.rarity }), el('span', { className: 'mute', textContent: 'value ' + (i.value || 0).toLocaleString() }))));
    if (!rows.length) list.append(el('p', { className: 'mute', textContent: 'No item with that name.' }));
  }
  async function loadInv() {
    const rows = await api('/api/admin/users/' + u.id + '/inventory');
    invBox.replaceChildren(...(rows.length ? rows.map((i) => el('div', {}, thumb(i),
      el('div', { className: 'nm' }, el('b', { textContent: i.name }), el('span', { className: 'mute', textContent: (i.status === 'held' ? i.rarity : i.status === 'listed' ? 'For sale' : 'Withdrawing') + (i.added_by ? ' · added by ' + i.added_by : '') })),
      i.status === 'held' ? armed('Remove', 'Sure?', async () => { await api('/api/admin/inventory/' + i.id, 'DELETE'); toast('Removed ' + i.name); loadInv(); done(); }) : null))
      : [el('p', { className: 'mute', textContent: 'Their inventory is empty.' })]));
  }
  addBtn.onclick = async () => {
    if (!chosen) return;
    addBtn.disabled = true;
    try { const r = await api('/api/admin/users/' + u.id + '/inventory', 'POST', { item_id: chosen.id, qty: qty.value, note: note.value }); toast('Added ' + r.added + '× ' + r.item + ' to ' + r.username); note.value = ''; await loadInv(); done(); }
    catch (e) { toast(e.message, true); }
    addBtn.disabled = false;
  };
  let t; search.oninput = () => { clearTimeout(t); t = setTimeout(drawPick, 120); };
  box.append(el('h2', {}, 'Inventory of ' + u.username),
    el('p', { className: 'mute', style: 'margin:0 0 10px', textContent: 'Items you add show up in their inventory right away, can be sold and withdrawn, and are marked "added by" you. They are not counted in what the bot should be holding.' }),
    search, list,
    el('div', { className: 'tools', style: 'margin:10px 0 0;align-items:center' }, el('span', { className: 'mute', textContent: 'How many' }), qty, note, addBtn,
      el('button', { className: 'ghost', textContent: 'Close', onclick: () => $('adjust').replaceChildren() })),
    el('h2', { style: 'margin-top:18px' }, 'What they have'), invBox);
  $('adjust').replaceChildren(box);
  drawPick(); await loadInv(); search.focus(); window.scrollTo({ top: 0 });
}

// ---------- Bot tab ----------
async function botTab() {
  async function load() {
    const d = await api('/api/admin/bot');
    const b = d.bot;
    const recC = (v) => Math.round((Number(v) || 0) * (d.rec_per_1k || 20) / 10);
    const av = el('div', { className: 'bav' }, el('i'));
    if (b.avatar && /^https:\/\/[\w.-]+\.rbxcdn\.com\//.test(b.avatar)) av.style.backgroundImage = 'url("' + b.avatar + '")'; else av.prepend(b.username[0].toUpperCase());
    const seen = d.last_seen ? 'Last heard from ' + when(d.last_seen) : 'Not heard from since the site last restarted';
    const head = el('section', { className: 'card' }, el('div', { className: 'bothd' + (b.online ? ' on' : '') }, av,
      el('div', { className: 'grow' }, el('h2', { textContent: b.username }),
        el('div', { className: 'mute' }, el('span', { className: 'pill ' + (b.online ? 'ok' : 'bad'), textContent: b.online ? 'Online' : 'Offline' }), '  ', seen, ' · Roblox ID ', el('a', { href: b.profile, target: '_blank', rel: 'noopener', textContent: b.id }))),
      el('a', { className: 'ghost sm', href: b.link, target: '_blank', rel: 'noopener', textContent: 'Open private server', style: 'border:1px solid var(--line);padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--text)' })),
      !d.api_enabled ? el('p', { style: 'color:var(--bad);margin:12px 0 0', textContent: 'Trading API is off. Set BOT_API_KEY in Railway so the bot can talk to the site.' }) : null,
      el('p', { className: 'mute', style: 'margin:12px 0 0', textContent: 'Online means the bot program called the site in the last 3 minutes. Change the bot with BOT_USERNAME, BOT_USER_ID and BOT_SERVER_LINK in Railway.' }));

    // Expected vs reported stock
    const rep = new Map(); (d.stock ? d.stock.items : []).forEach((i) => rep.set(i.name.toLowerCase(), i.qty));
    const units = d.expected.reduce((a, i) => a + i.qty, 0);
    const worth = d.expected.reduce((a, i) => a + i.qty * recC(i.value), 0);
    const valueSum = d.expected.reduce((a, i) => a + i.qty * (i.value || 0), 0);
    let mismatches = 0;
    const body = el('tbody');
    d.expected.forEach((i) => {
      const has = d.stock ? rep.get(i.name.toLowerCase()) || 0 : null;
      const diff = has == null ? null : has - i.qty;
      if (diff) mismatches++;
      body.append(el('tr', {},
        el('td', {}, el('span', { className: 'irow' }, thumb(i), i.name)),
        el('td', {}, el('span', { className: 'pill', style: 'color:' + (RCO[i.rarity] || RCO.Common), textContent: i.rarity })),
        el('td', {}, el('b', { textContent: i.qty })),
        el('td', { className: 'mute', textContent: [i.held && i.held + ' held', i.listed && i.listed + ' for sale', i.withdrawing && i.withdrawing + ' withdrawing'].filter(Boolean).join(' · ') }),
        el('td', { textContent: has == null ? '—' : has }),
        el('td', {}, diff == null ? el('span', { className: 'mute', textContent: '—' }) : el('span', { className: 'diff ' + (diff ? 'bad' : 'ok'), textContent: diff ? (diff > 0 ? '+' : '') + diff : '✓' })),
        el('td', { className: 'mute', textContent: (i.value || 0).toLocaleString() })));
    });
    // Items the bot reported that the site does not expect at all
    const extra = d.stock ? d.stock.items.filter((r) => !d.expected.some((i) => i.name.toLowerCase() === r.name.toLowerCase())) : [];
    extra.forEach((r) => { mismatches++; body.append(el('tr', {}, el('td', { textContent: r.name }), el('td'), el('td', { textContent: '0' }), el('td', { className: 'mute', textContent: 'not owed to anyone' }), el('td', { textContent: r.qty }), el('td', {}, el('span', { className: 'diff bad', textContent: '+' + r.qty })), el('td'))); });
    if (!body.children.length) body.append(el('tr', {}, el('td', { colSpan: 7, className: 'empty', textContent: 'No deposited items on the site yet.' })));

    const stockNote = d.stock
      ? el('p', { className: 'mute', style: 'margin:0 0 10px' }, 'Bot last reported its inventory ' + when(d.stock.at) + '. ', mismatches ? el('b', { style: 'color:var(--bad)', textContent: mismatches + ' item' + (mismatches === 1 ? '' : 's') + ' don\'t match.' }) : el('b', { style: 'color:var(--ok)', textContent: 'Everything matches.' }))
      : el('p', { className: 'mute', style: 'margin:0 0 10px', textContent: 'The bot hasn\'t reported its in-game inventory yet. Once it sends POST /api/bot/inventory, the "Bot has" column fills in and differences are flagged.' });

    // Withdraw queue
    const qBody = el('div', { style: 'display:grid;gap:8px' });
    if (!d.queue.length) qBody.append(el('p', { className: 'mute', textContent: 'Nobody is waiting to receive items.' }));
    d.queue.forEach((t) => qBody.append(el('div', { className: 'tools', style: 'margin:0;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px' },
      el('b', { textContent: '#' + t.id }), userCell(t.username, null), el('span', { style: 'flex:1', textContent: t.items.map((x) => x.name).join(', ') }),
      el('span', { className: 'pill ' + (t.status === 'in_progress' ? 'gold' : ''), textContent: t.status === 'in_progress' ? 'Trading now' : 'Waiting' }), el('span', { className: 'mute', textContent: when(t.created_at) }))));

    // Recent bot activity
    const rBody = el('tbody');
    if (!d.recent.length) rBody.append(el('tr', {}, el('td', { colSpan: 5, className: 'empty', textContent: 'The bot hasn\'t handled any trades yet.' })));
    d.recent.forEach((t) => rBody.append(el('tr', {},
      el('td', { className: 'mute', textContent: when(t.updated_at) }), el('td', { textContent: (t.kind === 'deposit' ? 'Deposit' : 'Withdraw') + ' #' + t.id }), el('td', { textContent: t.username || '' }),
      el('td', { textContent: t.items.map((x) => (x.qty > 1 ? x.qty + '× ' : '') + x.name).join(', ') }),
      el('td', {}, el('span', { className: 'pill ' + (t.status === 'completed' ? 'ok' : t.status === 'failed' ? 'bad' : ''), textContent: t.status.replace('_', ' ') })))));

    $('main').replaceChildren(el('h1', { textContent: 'Bot' }), head,
      el('div', { className: 'stats' },
        el('div', {}, el('span', { textContent: 'Items it should hold' }), String(units), el('em', { textContent: d.expected.length + ' different items' })),
        el('div', {}, el('span', { textContent: 'Total value' }), valueSum.toLocaleString(), el('em', { textContent: '≈ ' + usd(worth) + ' at recommended prices' })),
        el('div', { className: d.queue.length ? 'hot' : '' }, el('span', { textContent: 'Waiting to receive' }), String(d.queue.length), el('em', { textContent: 'withdrawals' })),
        el('div', {}, el('span', { textContent: 'Last 24h' }), String(d.day.deposits + d.day.withdrawals), el('em', { textContent: d.day.deposits + ' deposits · ' + d.day.withdrawals + ' withdrawals' })),
        el('div', {}, el('span', { textContent: 'Test items' }), String(d.test_items), el('em', { textContent: 'added by owners, not in the bot' }))),
      el('section', { className: 'card' }, el('h2', { textContent: 'What the bot has' }), stockNote,
        el('div', { className: 'scroll' }, el('table', { className: 'tbl' }, el('thead', {}, el('tr', {}, ...['Item', 'Rarity', 'Should have', 'Where', 'Bot has', 'Diff', 'Value each'].map((h) => el('th', { textContent: h })))), body))),
      el('section', { className: 'card' }, el('h2', { textContent: 'Waiting to receive items' }), qBody),
      el('section', { className: 'card' }, el('h2', { textContent: 'Recent bot trades' }),
        el('div', { className: 'scroll' }, el('table', { className: 'tbl' }, el('thead', {}, el('tr', {}, ...['When', 'Trade', 'User', 'Items', 'Result'].map((h) => el('th', { textContent: h })))), rBody))));
  }
  await load();
  poll = setInterval(() => load().catch(() => {}), 15000);
}

function denied() {
  $('wrap').replaceChildren(el('div', { className: 'denied' }, el('h1', { textContent: 'Page not found' }), el('p', { className: 'mute' }, el('a', { href: '/', textContent: 'Back to the shop' }))));
}

async function init() {
  me = await api('/api/me').catch(() => null);
  if (me) $('who').replaceChildren(RbxAuth.menu(me, async () => { await api('/api/logout', 'POST'); location.href = '/'; }));
  else $('who').replaceChildren(el('button', { className: 'btn sm', textContent: 'Log in with Roblox', onclick: () => RbxAuth.open(() => location.reload()) }));
  if (!me || !me.owner) return denied();
  $('badge').hidden = false;
  shell();
  go('overview');
}
init();
</script>
