<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Owner panel | SplitzMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0707;--surface:#140c0c;--raise:#1e1111;--line:#3a1717;--text:#f6efee;--mute:#a88a88;--gold:#e8202a;--violet:#8f0d14;--ok:#4ade80;--bad:#ff7a45}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3,.logo{font-family:Outfit,system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{resize:vertical}
button{cursor:pointer;font-weight:700}
button:focus-visible,input:focus,textarea:focus,select:focus,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button:disabled{opacity:.6;cursor:wait}
.btn{background:var(--gold);color:#fff;border:0}.ghost{background:transparent}.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.danger{color:var(--bad);border-color:#ff7a4566}.danger.arm{background:var(--bad);color:#2a0606;border-color:var(--bad)}
.mute{color:var(--mute);font-size:13px}
a{color:var(--gold)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;text-decoration:none;color:var(--text)}.logo b{color:var(--gold)}
.badge{font-size:11px;font-weight:800;background:#e8202a26;color:var(--gold);border-radius:6px;padding:3px 8px;margin-right:auto}
.av{width:32px;height:32px;border-radius:9px;background:var(--violet);display:grid;place-items:center;font-weight:800;font-family:Outfit,sans-serif;flex:none}
.wrap{max-width:1240px;margin:0 auto;padding:24px 24px 60px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:4px;position:sticky;top:12px}
.side button{text-align:left;background:transparent;border:0;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.side button.on{background:var(--gold);color:#fff}
.side button:hover:not(.on){background:var(--raise);color:var(--text)}
.side i{font-style:normal;font-size:11px;background:var(--bad);color:#2a0606;border-radius:99px;padding:1px 7px}
.side button.on i{background:#fff;color:var(--gold)}
h1{font-size:28px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.card h2{font-size:18px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:Outfit,sans-serif;font-size:30px;font-weight:700}
.stats span{display:block;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.stats em{display:block;font-style:normal;font-family:Manrope,sans-serif;font-size:12px;color:var(--mute);font-weight:500;margin-top:4px}
.stats .hot{border-color:#e8202a88}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{flex:1;min-width:200px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.who{display:flex;gap:10px;align-items:center;font-weight:700}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--raise);color:var(--mute);white-space:nowrap}
.pill.ok{background:#4ade8022;color:var(--ok)}.pill.bad{background:#ff7a4526;color:var(--bad)}.pill.gold{background:#e8202a26;color:var(--gold)}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.tk{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:var(--text)}
.tk.on{border-color:var(--gold)}
.tk b{display:block;margin-bottom:4px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thread{display:flex;flex-direction:column;min-height:480px}
.thead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}
.thead h2{margin:0;overflow-wrap:anywhere}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px 0;overflow-y:auto;max-height:58vh}
.msg{max-width:80%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.msg.staff{align-self:flex-end;background:#e8202a1a;border-color:#e8202a66}
.msg small{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:700}
.reply{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.reply textarea{flex:1;min-width:0}
.chat{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chat:last-child{border-bottom:0}
.chat p{margin:2px 0 0;overflow-wrap:anywhere;flex:1}
.chat .acts{display:flex;gap:6px;flex:none}
.empty{text-align:center;color:var(--mute);padding:36px 16px}
.denied{grid-column:1/-1;text-align:center;padding:90px 20px}
.maint{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.maint.on{border-color:var(--gold);background:linear-gradient(90deg,#e8202a22,var(--surface) 60%)}
.maint h2{margin-bottom:4px}.maint p{max-width:60ch}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06240f;padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr auto;gap:8px;align-items:center}
.form input,.form select{min-width:0;width:100%}
.thumb{width:36px;height:36px;border-radius:8px;background:var(--raise);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{max-width:100%;max-height:100%}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--c)}
.code{font-family:Outfit,sans-serif;letter-spacing:2px;color:var(--gold);font-size:17px}
.tag{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
details.raw summary{cursor:pointer;color:var(--mute);font-size:12px}
details.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:var(--mute);margin:6px 0 0}
@media (max-width:980px){.form{grid-template-columns:1fr 1fr}}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.side{position:static;grid-auto-flow:column;overflow-x:auto}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}

body{background:radial-gradient(ellipse 90% 60% at 50% -10%,#3a0a0d 0%,transparent 60%) fixed,var(--bg)}
.logo b{color:var(--gold);text-shadow:0 0 18px #e8202a88}
.btn{transition:filter .15s,box-shadow .15s}.btn:hover{filter:brightness(1.12);box-shadow:0 0 20px #e8202a55}
.card,.panel{transition:border-color .15s}.card:hover,.panel:hover{border-color:#5a1f1f}
::selection{background:#e8202a;color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a1717;border-radius:99px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="bar">
  <a class="logo" href="/">Splitz<b>Market</b></a>
  <span class="badge" id="badge" hidden>Owner panel</span>
  <div id="who"></div>
</div>
<div class="wrap" id="wrap"><div class="card mute" style="grid-column:1/-1">Loading...</div></div>
<div id="toast" role="status"></div>

<script src="/auth.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const el = (t, p = {}, ...k) => { const e = document.createElement(t); for (const [a, v] of Object.entries(p)) { if (a.includes('-')) e.setAttribute(a, v); else e[a] = v; } k.forEach((x) => x != null && e.append(x)); return e; };
const toast = (t, bad) => { const x = $('toast'); x.textContent = t; x.style.background = bad ? 'var(--bad)' : ''; x.classList.add('show'); setTimeout(() => x.classList.remove('show'), 2200); };
const when = (d) => new Date(d).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Something went wrong'); e.status = r.status; throw e; }
  return d;
}
// Two-click confirm instead of a browser popup.
function armed(label, armedLabel, run, cls = 'ghost sm danger') {
  const b = el('button', { className: cls, textContent: label });
  let t = null;
  b.onclick = async () => {
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = armedLabel; t = setTimeout(() => { b.classList.remove('arm'); b.textContent = label; }, 3000); return; }
    clearTimeout(t); b.disabled = true;
    try { await run(); } catch (e) { toast(e.message, true); b.disabled = false; b.classList.remove('arm'); b.textContent = label; }
  };
  return b;
}
const userCell = (name, avatar) => el('span', { className: 'who' }, avEl({ username: name || '?', avatar }), name || 'deleted');

let me = null, tab = 'overview', stats = null, poll = null;
const TABS = [['overview', 'Overview'], ['trades', 'Trades'], ['market', 'Market'], ['users', 'Users & balances'], ['support', 'Support chats'], ['chat', 'Live chat'], ['items', 'Items'], ['logs', 'Logs']];
const usd = (c) => window.money ? window.money(c) : '$' + (c / 100).toFixed(2);

function shell() {
  const side = el('aside', { className: 'side', id: 'side' });
  $('wrap').replaceChildren(side, el('main', { id: 'main' }));
  drawSide();
}
function drawSide() {
  $('side').replaceChildren(...TABS.map(([k, label]) => el('button', { className: tab === k ? 'on' : '', onclick: () => go(k) },
    label, k === 'support' && stats && stats.waiting ? el('i', { textContent: stats.waiting }) : k === 'trades' && stats && stats.activeTrades ? el('i', { textContent: stats.activeTrades }) : null)));
}
async function go(k) {
  tab = k; clearInterval(poll); drawSide();
  try { await ({ overview, users, support, chat, market, items, trades, logs })[k](); }
  catch (e) { $('main').replaceChildren(el('div', { className: 'card', textContent: e.message })); }
}
async function refreshStats() { stats = await api('/api/admin/stats'); drawSide(); }

async function overview() {
  await refreshStats();
  const s = stats;
  const tile = (label, n, sub, hot) => el('div', { className: hot ? 'hot' : '' }, el('span', { textContent: label }), String(n), sub ? el('em', { textContent: sub }) : null);
  const waiting = await api('/api/admin/tickets');
  const list = el('div', {});
  const need = waiting.filter((t) => !t.last_staff);
  if (!need.length) list.append(el('p', { className: 'mute', textContent: 'Nobody is waiting on a reply.' }));
  need.slice(0, 8).forEach((t) => list.append(el('button', { className: 'tk', onclick: () => { go('support').then(() => openTicket(t.id)); } },
    el('b', { textContent: t.subject }), el('span', { className: 'mute', textContent: t.username + ' · ' + when(t.updated_at) }))));
  const set = await api('/api/admin/settings');
  const mBtn = armed(set.maintenance ? 'Turn maintenance off' : 'Turn maintenance on', set.maintenance ? 'Confirm: open the site' : 'Confirm: close the site', async () => {
    await api('/api/admin/settings', 'POST', { maintenance: !set.maintenance });
    toast(set.maintenance ? 'Site is open to everyone again' : 'Maintenance mode is on');
    setTimeout(() => location.reload(), 600);
  }, set.maintenance ? 'btn' : 'ghost danger');
  const maint = el('section', { className: 'card maint' + (set.maintenance ? ' on' : ''), id: 'maintenance' },
    el('div', {}, el('h2', { textContent: set.maintenance ? 'Maintenance mode is on' : 'Site is open' }),
      el('p', { className: 'mute', style: 'margin:0', textContent: set.maintenance
        ? 'Regular players see the maintenance page with the Discord link. Owners still see everything, so you can check updates before opening up.'
        : 'Turn on maintenance to hide the site from regular players while you work on it. Owners keep full access.' })),
    mBtn);
  $('main').replaceChildren(el('h1', { textContent: 'Overview' }), maint,
    el('div', { className: 'stats' },
      tile('Users', s.users, s.newUsers + ' joined in the last 24h'),
      tile('Waiting on reply', s.waiting, s.openTickets + ' open tickets', s.waiting > 0),
      tile('Chat messages', s.messages, s.messagesToday + ' in the last 24h'),
      tile('Active trades', s.activeTrades, s.itemsHeld + ' items held on site', s.activeTrades > 0),
      tile('Sales (24h)', usd(s.volume24), s.sales24 + ' items sold'),
      tile('For sale', s.listings, 'active listings'),
      tile('Balances owed', usd(s.balances), 'total of everyone\'s balance'),
      tile('Banned users', s.banned, '')),
    el('section', { className: 'card' }, el('h2', { textContent: 'Tickets waiting on you' }), list),
    el('p', { className: 'mute', textContent: 'Owners: ' + s.owners.join(', ') + '. Change this with the OWNERS variable in Railway. Trading API: ' + (s.apiEnabled ? 'on' : 'off (set BOT_API_KEY in Railway)') + '.' }));
}

async function users() {
  const q = el('input', { placeholder: 'Search by Roblox username' });
  const body = el('tbody');
  const table = el('div', { className: 'card scroll' }, el('table', { className: 'tbl' },
    el('thead', {}, el('tr', {}, ...['User', 'Roblox ID', 'Joined', 'Balance', 'Items', 'For sale', 'Status', ''].map((h) => el('th', { textContent: h })))), body));
  async function load() {
    const rows = await api('/api/admin/users?q=' + encodeURIComponent(q.value));
    body.replaceChildren();
    if (!rows.length) body.append(el('tr', {}, el('td', { colSpan: 8, className: 'empty', textContent: 'No users found.' })));
    rows.forEach((u) => {
      const status = u.owner ? el('span', { className: 'pill gold', textContent: 'Owner' }) : u.banned ? el('span', { className: 'pill bad', textContent: 'Banned' }) : el('span', { className: 'pill ok', textContent: 'Active' });
      const act = u.owner ? '' : u.banned
        ? el('button', { className: 'ghost sm', textContent: 'Unban', onclick: async () => { await api(`/api/admin/users/${u.id}/ban`, 'POST', { banned: false }); toast('Unbanned ' + u.username); load(); } })
        : armed('Ban', 'Confirm ban', async () => { await api(`/api/admin/users/${u.id}/ban`, 'POST', { banned: true }); toast('Banned ' + u.username); load(); });
      body.append(el('tr', {},
        el('td', {}, userCell(u.username, u.avatar_url)),
        el('td', {}, u.roblox_id ? el('a', { href: 'https://www.roblox.com/users/' + u.roblox_id + '/profile', target: '_blank', rel: 'noopener', textContent: u.roblox_id }) : el('span', { className: 'mute', textContent: 'Not verified' })),
        el('td', { className: 'mute', textContent: when(u.created_at) }),
        el('td', {}, el('b', { textContent: usd(u.balance_cents) })), el('td', { textContent: u.items }), el('td', { textContent: u.listings }),
        el('td', {}, status), el('td', { style: 'white-space:nowrap' }, el('button', { className: 'ghost sm', textContent: 'Balance', onclick: () => adjust(u, load) }), ' ', act)));
    });
  }
  let t; q.oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
  $('main').replaceChildren(el('h1', { textContent: 'Users & balances' }),
    el('p', { className: 'mute', textContent: 'Add funds after someone pays you, and remove funds when you pay out a cash out. Every change is saved in Logs and in the user\'s transactions.' }),
    el('div', { className: 'tools' }, q), el('div', { id: 'adjust' }), table);
  await load();
}

let curTicket = null, lastCount = -1;
async function support() {
  const filter = el('select', {}, el('option', { value: 'open', textContent: 'Open tickets' }), el('option', { value: 'closed', textContent: 'Closed tickets' }), el('option', { value: 'all', textContent: 'All tickets' }));
  const list = el('div', { id: 'tlist' });
  const thread = el('section', { className: 'card thread', id: 'thread' }, el('div', { className: 'empty', textContent: 'Pick a ticket to read and reply.' }));
  async function loadList() {
    const rows = await api('/api/admin/tickets?status=' + filter.value);
    list.replaceChildren();
    if (!rows.length) list.append(el('p', { className: 'mute', textContent: 'No tickets here.' }));
    rows.forEach((t) => list.append(el('button', { className: 'tk' + (curTicket === t.id ? ' on' : ''), onclick: () => openTicket(t.id) },
      el('b', { textContent: t.subject }),
      el('span', { className: 'row' },
        t.status === 'open' && !t.last_staff ? el('span', { className: 'pill gold', textContent: 'Needs reply' }) : el('span', { className: 'pill' + (t.status === 'open' ? ' ok' : ''), textContent: t.status === 'open' ? 'Open' : 'Closed' }),
        el('span', { className: 'mute', textContent: t.username + ' · ' + when(t.updated_at) })))));
  }
  window.reloadTickets = loadList;
  filter.onchange = loadList;
  $('main').replaceChildren(el('h1', { textContent: 'Support chats' }),
    el('div', { className: 'split' }, el('section', { className: 'card' }, el('div', { className: 'tools' }, filter), list), thread));
  await loadList();
  poll = setInterval(() => { loadList().catch(() => {}); if (curTicket) drawThread(false).catch(() => {}); refreshStats().catch(() => {}); }, 6000);
  if (curTicket) drawThread(true).catch(() => {});
}
async function openTicket(id) { curTicket = id; lastCount = -1; await drawThread(true); if (window.reloadTickets) window.reloadTickets().catch(() => {}); }
async function drawThread(fresh) {
  if (!$('thread')) return;
  const d = await api('/api/tickets/' + curTicket);
  if (!fresh && d.messages.length === lastCount) return;
  lastCount = d.messages.length;
  const box = el('div', { className: 'msgs' });
  d.messages.forEach((m) => box.append(el('div', { className: 'msg' + (m.staff ? ' staff' : '') },
    el('small', { textContent: (m.staff ? 'Staff · ' + (m.username || '') : (m.username || 'user')) + ' · ' + when(m.created_at) }), m.body)));
  const keep = fresh ? '' : ($('thread').querySelector('textarea') || {}).value || '';
  const input = el('textarea', { rows: 2, maxLength: 1000, placeholder: 'Reply as SplitzMarket staff', value: keep });
  const send = el('button', { className: 'btn', textContent: 'Send' });
  const sendIt = async () => {
    if (!input.value.trim()) return; send.disabled = true;
    try { await api('/api/tickets/' + curTicket + '/messages', 'POST', { body: input.value }); input.value = ''; await drawThread(true); window.reloadTickets && window.reloadTickets(); refreshStats().catch(() => {}); }
    catch (e) { toast(e.message, true); }
    send.disabled = false;
  };
  send.onclick = sendIt;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendIt(); } });
  const open = d.ticket.status === 'open';
  const toggle = el('button', { className: 'ghost sm', textContent: open ? 'Close ticket' : 'Reopen', onclick: async () => {
    await api(`/api/admin/tickets/${curTicket}/status`, 'POST', { status: open ? 'closed' : 'open' }); toast(open ? 'Ticket closed' : 'Ticket reopened');
    await drawThread(true); window.reloadTickets && window.reloadTickets(); refreshStats().catch(() => {});
  } });
  $('thread').replaceChildren(
    el('div', { className: 'thead' },
      el('div', {}, el('h2', { textContent: d.ticket.subject }), el('div', { className: 'mute', textContent: '#' + d.ticket.id + ' · from ' + d.ticket.username + ' · ' + when(d.ticket.created_at) })),
      el('div', { className: 'row' }, el('span', { className: 'pill' + (open ? ' ok' : ''), textContent: open ? 'Open' : 'Closed' }), toggle)),
    box, el('div', { className: 'reply' }, input, send));
  box.scrollTop = box.scrollHeight;
}

async function chat() {
  const box = el('section', { className: 'card' });
  async function load() {
    const rows = await api('/api/admin/chat');
    box.replaceChildren(el('h2', { textContent: 'Latest 200 messages' }));
    if (!rows.length) box.append(el('p', { className: 'empty', textContent: 'No chat messages yet.' }));
    rows.forEach((m) => box.append(el('div', { className: 'chat' },
      el('div', { style: 'flex:1;min-width:0' }, el('span', { className: 'row' }, el('b', { textContent: m.username }), el('span', { className: 'mute', textContent: when(m.created_at) })), el('p', { textContent: m.body })),
      el('div', { className: 'acts' }, armed('Delete', 'Confirm', async () => { await api('/api/admin/chat/' + m.id, 'DELETE'); toast('Message deleted'); load(); })))));
  }
  $('main').replaceChildren(el('h1', { textContent: 'Live chat' }), el('p', { className: 'mute', textContent: 'Deleted messages disappear for people when they reload the page. Ban users from the Users tab.' }), box);
  await load();
  poll = setInterval(() => load().catch(() => {}), 10000);
}

function adjust(u, done) {
  const amt = el('input', { placeholder: 'Amount, e.g. 10 or -10', inputMode: 'decimal' });
  const note = el('input', { placeholder: 'Note (e.g. PayPal txn id)', maxLength: 120 });
  const err = el('div', { className: 'mute', style: 'color:var(--bad)' });
  const save = armed('Apply', 'Confirm', async () => {
    const r = await api('/api/admin/users/' + u.id + '/balance', 'POST', { amount: amt.value, note: note.value });
    toast(u.username + ' now has ' + usd(r.balance)); $('adjust').replaceChildren(); done();
  }, 'btn');
  $('adjust').replaceChildren(el('section', { className: 'card' }, el('h2', {}, 'Change balance for ' + u.username + ' · ', el('span', { className: 'mute', textContent: 'now ' + usd(u.balance_cents) })),
    el('p', { className: 'mute', textContent: 'Positive adds funds. Negative removes them, for example after paying a cash out.', style: 'margin:0 0 10px' }),
    el('div', { className: 'tools', style: 'margin:0' }, amt, note, save, el('button', { className: 'ghost', textContent: 'Cancel', onclick: () => $('adjust').replaceChildren() })), err));
  amt.focus(); window.scrollTo({ top: 0 });
}

async function market() {
  const filter = sel(['active', 'sold', 'cancelled', 'all']);
  const body = el('tbody');
  async function load() {
    const rows = await api('/api/admin/market' + (filter.value === 'all' ? '' : '?status=' + filter.value));
    body.replaceChildren();
    if (!rows.length) body.append(el('tr', {}, el('td', { colSpan: 7, className: 'empty', textContent: 'Nothing here.' })));
    rows.forEach((l) => {
      const dot = el('span', { className: 'dot' }); dot.style.setProperty('--c', RC[l.rarity] || RC.Common);
      body.append(el('tr', {},
        el('td', {}, dot, el('b', { textContent: l.name })), el('td', {}, el('b', { textContent: usd(l.price_cents) })),
        el('td', { textContent: l.seller || 'deleted' }), el('td', { textContent: l.buyer || '' }),
        el('td', {}, el('span', { className: 'pill' + (l.status === 'active' ? ' gold' : l.status === 'sold' ? ' ok' : ''), textContent: l.status })),
        el('td', { className: 'mute', style: 'white-space:nowrap', textContent: when(l.sold_at || l.created_at) }),
        el('td', {}, l.status === 'active' ? armed('Take down', 'Confirm', async () => { await api('/api/admin/market/' + l.id, 'DELETE'); toast('Listing taken down, item returned to seller'); load(); }) : '')));
    });
  }
  filter.onchange = load;
  $('main').replaceChildren(el('h1', { textContent: 'Market' }),
    el('p', { className: 'mute', textContent: 'Taking a listing down gives the item back to the seller\'s inventory. Sold items have already moved to the buyer.' }),
    el('div', { className: 'tools' }, filter),
    el('div', { className: 'card scroll' }, el('table', { className: 'tbl' }, el('thead', {}, el('tr', {}, ...['Item', 'Price', 'Seller', 'Buyer', 'Status', 'When', ''].map((h) => el('th', { textContent: h })))), body)));
  await load();
}

const RC = { Chroma: '#b78bff', Ancient: '#7c5cff', Godly: '#d94fd0', Unique: '#e6b422', Vintage: '#d9b98a', Legendary: '#ff4d4d', Rare: '#2fb36a', Uncommon: '#4d7cff', Common: '#8a8fa3' };
const TYPES = ['Knife', 'Gun', 'Pet', 'Misc'], RARITIES = Object.keys(RC);
const sel = (list, v) => { const s = el('select', {}, ...list.map((x) => el('option', { value: x, textContent: x }))); if (v) s.value = v; return s; };

async function items() {
  const name = el('input', { placeholder: 'Item name', maxLength: 60 }), type = sel(TYPES), rarity = sel(RARITIES, 'Godly');
  const value = el('input', { type: 'number', min: 0, placeholder: 'Value' }), img = el('input', { placeholder: 'Image link (https://, optional)' });
  let editing = null;
  const save = el('button', { className: 'btn', textContent: 'Add item' });
  const cancel = el('button', { className: 'ghost sm', textContent: 'Cancel edit', hidden: true });
  const reset = () => { editing = null; name.value = value.value = img.value = ''; type.value = 'Knife'; rarity.value = 'Godly'; save.textContent = 'Add item'; cancel.hidden = true; };
  cancel.onclick = reset;
  save.onclick = async () => {
    const body = { name: name.value, type: type.value, rarity: rarity.value, value: value.value, image_url: img.value };
    try {
      if (editing) await api('/api/admin/items/' + editing, 'PATCH', body); else await api('/api/admin/items', 'POST', body);
      toast(editing ? 'Item saved' : 'Item added'); reset(); load();
    } catch (e) { toast(e.message, true); }
  };
  const csv = el('textarea', { rows: 6, placeholder: 'name, type, rarity, value, image link (optional)\nHarvester, Knife, Ancient, 1800\nIcepiercer, Knife, Godly, 900' });
  const result = el('div', { className: 'mute' });
  const imp = el('button', { className: 'btn', textContent: 'Import' });
  imp.onclick = async () => {
    imp.disabled = true;
    try { const r = await api('/api/admin/items/import', 'POST', { text: csv.value }); result.replaceChildren('Added ' + r.added + ', updated ' + r.updated + '.', ...r.errors.map((e) => el('div', { textContent: e, style: 'color:var(--bad)' }))); if (!r.errors.length) csv.value = ''; load(); }
    catch (e) { toast(e.message, true); }
    imp.disabled = false;
  };
  const search = el('input', { placeholder: 'Search items' });
  const body = el('tbody');
  let all = [];
  function draw() {
    const q = search.value.toLowerCase();
    body.replaceChildren();
    const rows = all.filter((i) => i.name.toLowerCase().includes(q));
    if (!rows.length) body.append(el('tr', {}, el('td', { colSpan: 6, className: 'empty', textContent: all.length ? 'No matches.' : 'No items yet. Add one above or import a list.' })));
    rows.forEach((i) => {
      const th = el('span', { className: 'thumb' });
      if (i.image_url) th.append(el('img', { src: i.image_url, alt: '', loading: 'lazy' }));
      const dot = el('span', { className: 'dot' }); dot.style.setProperty('--c', RC[i.rarity] || RC.Common);
      body.append(el('tr', { style: i.active ? '' : 'opacity:.5' },
        el('td', {}, el('span', { className: 'who' }, th, i.name)),
        el('td', { textContent: i.type }), el('td', {}, dot, i.rarity), el('td', { textContent: i.value.toLocaleString() }),
        el('td', { textContent: i.held }),
        el('td', { style: 'white-space:nowrap' },
          el('button', { className: 'ghost sm', textContent: 'Edit', onclick: () => { editing = i.id; name.value = i.name; type.value = i.type; rarity.value = i.rarity; value.value = i.value; img.value = i.image_url || ''; save.textContent = 'Save item'; cancel.hidden = false; name.focus(); window.scrollTo({ top: 0 }); } }), ' ',
          el('button', { className: 'ghost sm', textContent: i.active ? 'Hide' : 'Show', onclick: async () => { await api('/api/admin/items/' + i.id, 'PATCH', { active: !i.active }); load(); } }))));
    });
  }
  async function load() { all = await api('/api/admin/items'); draw(); }
  search.oninput = draw;
  $('main').replaceChildren(el('h1', { textContent: 'Items' }),
    el('section', { className: 'card' }, el('h2', { textContent: 'Add or edit an item' }), el('div', { className: 'form' }, name, type, rarity, value, img, save), el('div', { style: 'margin-top:8px' }, cancel)),
    el('section', { className: 'card' }, el('h2', { textContent: 'Import a list' }),
      el('p', { className: 'mute', textContent: 'One item per line. Paste from a spreadsheet saved as CSV. Items with a name that already exists get updated.' }),
      csv, el('div', { className: 'row', style: 'margin-top:10px' }, imp, result)),
    el('div', { className: 'tools' }, search),
    el('div', { className: 'card scroll' }, el('table', { className: 'tbl' },
      el('thead', {}, el('tr', {}, ...['Item', 'Type', 'Rarity', 'Value', 'Held on site', ''].map((h) => el('th', { textContent: h })))), body)));
  await load();
}

async function trades() {
  const filter = sel(['active', 'completed', 'failed', 'cancelled', 'all']);
  const body = el('div');
  const label = { pending: 'Waiting', in_progress: 'In progress', completed: 'Completed', failed: 'Failed', cancelled: 'Cancelled' };
  const cls = { pending: 'gold', in_progress: 'gold', completed: 'ok', failed: 'bad', cancelled: '' };
  async function load() {
    const rows = await api('/api/admin/trades?status=' + filter.value);
    body.replaceChildren();
    if (!rows.length) body.append(el('div', { className: 'card empty', textContent: 'No trades here.' }));
    rows.forEach((t) => {
      const active = t.status === 'pending' || t.status === 'in_progress';
      const names = t.items.map((x) => (x.qty > 1 ? x.qty + '× ' : '') + x.name).join(', ');
      const acts = el('div', { className: 'row' });
      if (t.status === 'pending') acts.append(el('button', { className: 'ghost sm', textContent: 'Claim', onclick: async () => { try { await api(`/api/admin/trades/${t.id}/claim`, 'POST', {}); load(); } catch (e) { toast(e.message, true); } } }));
      if (active) acts.append(
        armed('Mark completed', 'Confirm completed', async () => { await api(`/api/admin/trades/${t.id}/complete`, 'POST', {}); toast('Trade completed'); load(); refreshStats(); }, 'btn sm'),
        armed('Mark failed', 'Confirm failed', async () => { await api(`/api/admin/trades/${t.id}/fail`, 'POST', { reason: 'Marked failed by ' + me.username }); toast('Trade marked failed'); load(); refreshStats(); }));
      body.append(el('section', { className: 'card' },
        el('div', { className: 'thead', style: 'border:0;padding:0' },
          el('div', {}, el('h2', { style: 'margin:0', textContent: (t.kind === 'deposit' ? 'Deposit' : 'Withdraw') + ' #' + t.id }),
            el('div', { className: 'mute' }, 'Roblox user ', t.roblox_id ? el('a', { href: 'https://www.roblox.com/users/' + t.roblox_id + '/profile', target: '_blank', rel: 'noopener', textContent: t.roblox_username }) : (t.roblox_username || 'deleted'),
              ' · ' + when(t.created_at) + (t.handled_by ? ' · handled by ' + t.handled_by : ''))),
          el('div', { className: 'row' }, el('span', { className: 'code', textContent: t.code }), el('span', { className: 'pill ' + (cls[t.status] || ''), textContent: label[t.status] || t.status }))),
        el('p', { style: 'margin:12px 0', textContent: names }),
        acts));
    });
  }
  filter.onchange = load;
  $('main').replaceChildren(el('h1', { textContent: 'Trades' }),
    el('p', { className: 'mute', textContent: 'Check the Roblox username and code before every trade. Completing a deposit adds the listed items to the user\'s inventory. Failing a withdrawal gives their items back.' }),
    el('div', { className: 'tools' }, filter), body);
  await load();
  poll = setInterval(() => { load().catch(() => {}); refreshStats().catch(() => {}); }, 8000);
}

async function logs() {
  const q = el('input', { placeholder: 'Search by username, trade:12, item name...' });
  const type = el('select', {}, ...[['', 'Everything'], ['trade', 'Trades'], ['user', 'Users and logins'], ['item', 'Items'], ['ticket', 'Tickets'], ['chat', 'Chat'], ['market', 'Market'], ['balance', 'Balances'], ['site', 'Maintenance']].map(([v, t]) => el('option', { value: v, textContent: t })));
  const body = el('tbody');
  const nice = (a) => a.replace('.', ' ').replace(/_/g, ' ');
  async function load() {
    const rows = await api('/api/admin/logs?q=' + encodeURIComponent(q.value) + '&type=' + type.value);
    body.replaceChildren();
    if (!rows.length) body.append(el('tr', {}, el('td', { colSpan: 4, className: 'empty', textContent: 'Nothing logged yet.' })));
    rows.forEach((l) => body.append(el('tr', {},
      el('td', { className: 'mute', style: 'white-space:nowrap', textContent: when(l.created_at) }),
      el('td', {}, el('b', { textContent: l.actor })),
      el('td', {}, nice(l.action), l.target ? el('div', { className: 'tag', textContent: l.target }) : null),
      el('td', {}, l.detail ? el('details', { className: 'raw' }, el('summary', { textContent: 'Details' }), el('pre', { textContent: JSON.stringify(l.detail, null, 2) })) : ''))));
  }
  let t; q.oninput = () => { clearTimeout(t); t = setTimeout(load, 250); }; type.onchange = load;
  $('main').replaceChildren(el('h1', { textContent: 'Logs' }),
    el('p', { className: 'mute', textContent: 'Every login, trade, ban, item change and deletion, newest first. Use this to settle disputes or work out who to compensate.' }),
    el('div', { className: 'tools' }, q, type),
    el('div', { className: 'card scroll' }, el('table', { className: 'tbl' }, el('thead', {}, el('tr', {}, ...['When', 'Who', 'What', ''].map((h) => el('th', { textContent: h })))), body)));
  await load();
}

function denied() {
  $('wrap').replaceChildren(el('div', { className: 'denied' }, el('h1', { textContent: 'Page not found' }), el('p', { className: 'mute' }, el('a', { href: '/', textContent: 'Back to the shop' }))));
}

async function init() {
  me = await api('/api/me').catch(() => null);
  if (me) $('who').replaceChildren(RbxAuth.menu(me, async () => { await api('/api/logout', 'POST'); location.href = '/'; }));
  else $('who').replaceChildren(el('button', { className: 'btn sm', textContent: 'Log in with Roblox', onclick: () => RbxAuth.open(() => location.reload()) }));
  if (!me || !me.owner) return denied();
  $('badge').hidden = false;
  shell();
  go('overview');
}
init();
</script>
